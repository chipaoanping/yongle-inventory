<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ebdd">
<meta name="robots" content="noindex">
<title>永樂寄售庫存</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0}
img{max-width:100%}

/* Layout: a phone app. Sticky top bar, one scrolling screen per tab, fixed bottom nav with a raised 售出 button in the middle. */
:root{
  --bg:#f3ebdd; --surface:#fffaf1; --surface-2:#efe4d2; --ink:#3b2a1f; --muted:#86705e; --line:#e3d5bf;
  --accent:#a8322d; --accent-ink:#fffaf1; --accent-soft:#f6ddd6;
  --warn:#a86b12; --warn-soft:#f8e8c6; --bad:#b3261e; --bad-soft:#f9dcd7; --good:#3f7564; --good-soft:#dcebe3;
  --b1:#a8322d; --b1s:#f6ddd6; --b2:#3f7564; --b2s:#dcebe3; --b3:#a86b12; --b3s:#f8e8c6; --b4:#7a4b6e; --b4s:#efdfea; --b5:#5a3e2b; --b5s:#eadccb;
  --shadow:0 1px 0 rgba(90,62,43,.06),0 6px 18px rgba(90,62,43,.08);
  --scrim:rgba(40,25,15,.45);
  --f-head:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1511; --surface:#28201a; --surface-2:#332920; --ink:#f2e7d6; --muted:#b39e88; --line:#3f3328;
  --accent:#e2786c; --accent-ink:#1c1511; --accent-soft:#4a2622;
  --warn:#e9b45a; --warn-soft:#3d2e14; --bad:#f08a7f; --bad-soft:#45201c; --good:#8cc4ae; --good-soft:#1e352c;
  --b1:#e2786c; --b1s:#4a2622; --b2:#8cc4ae; --b2s:#1e352c; --b3:#e9b45a; --b3s:#3d2e14; --b4:#d6a3c8; --b4s:#3a2534; --b5:#d8b99a; --b5s:#3a2c20;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1511; --surface:#28201a; --surface-2:#332920; --ink:#f2e7d6; --muted:#b39e88; --line:#3f3328;
  --accent:#e2786c; --accent-ink:#1c1511; --accent-soft:#4a2622;
  --warn:#e9b45a; --warn-soft:#3d2e14; --bad:#f08a7f; --bad-soft:#45201c; --good:#8cc4ae; --good-soft:#1e352c;
  --b1:#e2786c; --b1s:#4a2622; --b2:#8cc4ae; --b2s:#1e352c; --b3:#e9b45a; --b3s:#3d2e14; --b4:#d6a3c8; --b4s:#3a2534; --b5:#d8b99a; --b5s:#3a2c20;
  --shadow:0 1px 2px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-inline:16px;padding-block:12px 8px;display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.04em}
.top .sub{font-size:13px;color:var(--muted);font-weight:500}
.top .grow{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)} .sync.bad::before{background:var(--bad)}

main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;border:0;font:inherit;color:inherit;text-align:left;min-width:0}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:20px;font-weight:900;overflow-wrap:anywhere}
.stat.money .v{color:var(--accent)}
button.stat{cursor:pointer}
.stat.alert .v{color:var(--warn)}
.stat.alert[aria-pressed="true"]{outline:2px solid var(--warn)}

/* search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 14px;box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:13px 0;font:inherit;font-size:16px;color:var(--ink);min-width:0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;background:var(--surface);color:var(--muted);box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips#catChips .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.warn[aria-pressed="true"]{background:var(--warn);color:var(--surface)}

/* cards */
.section-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted);margin-top:4px}
.section-h .count{font-weight:500}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:12px;min-width:0}
.card.tap{cursor:pointer}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.av.img{object-fit:cover;background:#fff;padding:0}
.chip .ci{width:22px;height:22px;border-radius:7px;object-fit:cover;vertical-align:middle;margin:-3px 6px -3px -6px;background:#fff}
.imgpick{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:2px dashed var(--line);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;font:inherit;font-size:20px}
.imgpick img{width:100%;height:100%;object-fit:cover;background:#fff}
.imgpick.has{border-style:solid}
.c1{background:var(--b1s);color:var(--b1)} .c2{background:var(--b2s);color:var(--b2)} .c3{background:var(--b3s);color:var(--b3)} .c4{background:var(--b4s);color:var(--b4)} .c5{background:var(--b5s);color:var(--b5)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.title{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.low{background:var(--warn-soft);color:var(--warn)} .tag.out{background:var(--bad-soft);color:var(--bad)} .tag.ok{background:var(--good-soft);color:var(--good)} .tag.cam{background:var(--accent-soft);color:var(--accent)}
main{padding-bottom:40px}
.pimg{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgba(20,12,8,.8);display:grid;place-items:center;z-index:9;padding:24px}
.zoom img{max-width:100%;max-height:80vh;border-radius:16px;background:#fff}
.card.sold{opacity:.55}
.right{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.qty{font-size:22px;font-weight:900}
.qty small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
/* 旗時 look: old photo-studio paper, qipao red, serif headings, small ornaments */
body{background-color:var(--bg);background-image:radial-gradient(rgba(90,62,43,.05) 1px,transparent 1px);background-size:6px 6px}
.top{background:linear-gradient(var(--bg) 80%,transparent)}
.top h1,.gatebox h1,.sheet h2,.hero b,.stat .v,.month b,.qty,.amt{font-family:var(--f-head);letter-spacing:.03em}
.top h1{font-size:24px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--accent)}
.kicker::before{content:"❀ "}
.card,.stat,.menu,.scard,.month,.empty,.search,.chip{border:1px solid var(--line)}
.card,.scard,.menu{border-radius:14px}
.section-h{font-family:var(--f-head);color:var(--ink);font-size:15px;letter-spacing:.06em}
.section-h::before{content:"⟡";color:var(--accent);font-family:var(--f-body)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips#catChips .chip[aria-pressed="true"]{border-color:var(--accent)}
.hero{background:var(--accent);position:relative;overflow:hidden;border:2px solid var(--accent);box-shadow:inset 0 0 0 4px var(--accent),inset 0 0 0 5px rgba(255,250,241,.55)}
.av{border-radius:50%} .av.img{border-radius:12px;border:1px solid var(--line)}
.sell,.btn.primary{box-shadow:0 2px 0 rgba(90,62,43,.18)}
.nav{background:var(--surface);box-shadow:0 -4px 16px rgba(90,62,43,.06)}
.sheet{border-top:3px solid var(--accent)}
.sheet::before{background:var(--accent);opacity:.35}
.gatebox h1::after{content:"✿ 寄售庫存 ✿";display:block;font-family:var(--f-body);font-size:13px;letter-spacing:.2em;color:var(--accent);margin-top:4px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.cat .k{font-size:13px;font-weight:700;color:var(--muted)}
.cat .v{font-family:var(--f-head);font-size:26px;font-weight:900;line-height:1.1}
.cat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px;font-family:var(--f-body)}
.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fffaf1}
.cat[aria-pressed="true"] .k,.cat[aria-pressed="true"] small{color:#fffaf1}
.cat.zero .v{color:var(--bad)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{margin:6px 0 0;font-family:var(--f-head);font-size:17px;display:flex;align-items:baseline;gap:8px}
.grp h3 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.tile .ph{aspect-ratio:1;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-head);font-size:28px;font-weight:900;color:var(--muted)}
.tile .ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.tile .tb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.tile .nm{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tile.sold{opacity:.5}
#list{display:flex;flex-direction:column;gap:16px}
.vt{display:flex;align-self:flex-end;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
.vt button{border:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer}
.vt button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tile .nm2{font-weight:800;font-size:15px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.tile .row .q{font-family:var(--f-head);font-size:18px;font-weight:900;color:var(--ink);white-space:nowrap}
.tile .row .q small{font-size:11px;color:var(--muted);font-family:var(--f-body);margin-left:1px;font-weight:500}
.lst{display:flex;flex-direction:column;gap:8px}
.vt.tabs{align-self:stretch;display:grid;grid-template-columns:1fr 1fr}
.vt.tabs button{font-size:15px;padding:9px}
.mchips{display:flex;gap:8px;flex-wrap:wrap}
.mchips button{border:1px solid var(--line);background:var(--surface);font:inherit;font-weight:700;font-size:14px;color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer}
.mchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{display:flex;flex-direction:column;gap:6px}
.day h3{margin:4px 0 0;font-family:var(--f-head);font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.day h3 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:700}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.srow .r{text-align:right;white-space:nowrap;display:flex;flex-direction:column}
.srow .r b{font-size:16px}
.srow .r small{font-size:12px;color:var(--good);font-weight:700}
#stats[hidden],#tools[hidden],#salesBox[hidden],#list[hidden]{display:none!important}
.rfb{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:7px 11px;border-radius:99px;cursor:pointer;flex:none}
.rfb.spin svg{animation:rfs .8s linear infinite}@keyframes rfs{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top"><img id="blogo" alt="" hidden style="width:48px;height:48px;border-radius:14px;object-fit:cover;background:#fff;flex:none"><div class="grow"><div class="kicker">旗時 · 永樂市場 2F 寄售</div><h1 id="bname">永樂寄售庫存</h1><div class="sub" id="upd">讀取中…</div></div><button class="rfb" type="button" id="refreshBtn" aria-label="重新整理" title="重新整理"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg><span>重新整理</span></button></header>
<main>
  <div class="screen">
    <div class="vt tabs" id="tabs" role="tablist" hidden><button type="button" data-tab="stock">庫存</button><button type="button" data-tab="sales">售出紀錄</button></div>
    <div id="salesBox" hidden style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="stats" id="stats" hidden>
      <div class="stat"><span class="k">在店商品</span><span class="v num" id="sKinds">0</span></div>
      <div class="stat"><span class="k">總件數</span><span class="v num" id="sQty">0</span></div>
      <div class="stat money"><span class="k">庫存總售價</span><span class="v num" id="sVal">$0</span></div>
    </div>
    <div id="tools" hidden style="display:flex;flex-direction:column;gap:12px">
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜尋編號或商品名稱" aria-label="搜尋"></label>
      <div class="section-h" id="catH" hidden>各分類剩餘數量（點一下只看這類）</div>
      <div class="cats" id="catChips"></div>
      <div class="vt" role="group" aria-label="顯示方式"><button type="button" data-vm="grid">▦ 格狀</button><button type="button" data-vm="list">☰ 清單</button></div>
    </div>
    <div id="list"><div class="empty">讀取中…</div></div>
    <p class="foot">✿ 旗時 · 永樂市場 2F 寄售庫存，只顯示你的品牌 ✿</p>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const money=n=>"$"+Math.round(Number(n||0)).toLocaleString("en-US");
const fmtN=n=>Number(n||0).toLocaleString("en-US");
let view=null, cat="", tab="stock", smonth="", mode="grid"; try{ mode=localStorage.getItem("vendorMode")==="list"?"list":"grid"; }catch(e){}
function fail(t){ $("#upd").textContent=""; $("#list").innerHTML=`<div class="empty"><b>${esc(t)}</b>請向永樂索取最新的連結。</div>`; }
const mk=t=>{ const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const WD="日一二三四五六";
function renderSales(){
  const ss=view.sales||[]; const showPay=ss.some(x=>x.payout!=null);
  const now=new Date(); const months=[]; for(let k=0;k<Number(view.salesFrom||3);k++){ const d=new Date(now.getFullYear(),now.getMonth()-k,1); months.push(mk(d)); }
  if(!months.includes(smonth)) smonth=months[0];
  const list=ss.filter(x=>mk(x.at)===smonth);
  const sum=(f)=>list.reduce((t,x)=>t+Number(x[f]||0),0);
  const days=[]; list.forEach(x=>{ const d=new Date(x.at); const k=d.toDateString(); let g=days.find(y=>y.k===k); if(!g) days.push(g={k,d,list:[]}); g.list.push(x); });
  $("#salesBox").innerHTML=`<div class="mchips">${months.map(m=>`<button type="button" data-sm="${m}" aria-pressed="${m===smonth}">${Number(m.slice(5))} 月</button>`).join("")}</div>
    <div class="stats"><div class="stat"><span class="k">售出件數</span><span class="v num">${fmtN(sum("qty"))}</span></div><div class="stat"><span class="k">售出金額</span><span class="v num">${money(sum("amount"))}</span></div>${showPay?`<div class="stat money"><span class="k">店家可分得</span><span class="v num">${money(sum("payout"))}</span></div>`:""}</div>
    ${days.length?days.map(g=>`<section class="day"><h3>${g.d.getMonth()+1}/${g.d.getDate()}（${WD[g.d.getDay()]}）<span>${fmtN(g.list.reduce((t,x)=>t+x.qty,0))} 件 · ${money(g.list.reduce((t,x)=>t+x.amount,0))}</span></h3>
      ${g.list.map(x=>`<div class="srow"><div class="body"><span class="title">${esc(x.name)}</span><span class="meta">${x.sku?`<span class="tag">#${esc(x.sku)}</span>`:""}${x.qty>1?`<span>×${fmtN(x.qty)}</span>`:""}</span></div><div class="r"><b class="num">${money(x.amount)}</b>${x.payout!=null?`<small>可分得 ${money(x.payout)}</small>`:""}</div></div>`).join("")}</section>`).join("")
      :`<div class="empty"><b>${Number(smonth.slice(5))} 月還沒有售出紀錄</b></div>`}
    <p class="foot">只顯示最近 ${fmtN(months.length)} 個月；實際金額以月結對帳單為準。</p>`;
}
function render(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tab===tab)));
  const st=tab==="stock"; $("#stats").hidden=$("#tools").hidden=$("#list").hidden=!st; $("#salesBox").hidden=st;
  if(!st) return renderSales();
  const its=view.items||[]; const inStock=its.filter(i=>Number(i.qty)>0);
  $("#sKinds").textContent=fmtN(inStock.length); $("#sQty").textContent=fmtN(inStock.reduce((s,i)=>s+Number(i.qty||0),0));
  $("#sVal").textContent=money(inStock.reduce((s,i)=>s+Number(i.qty||0)*Number(i.price||0),0));
  const cats=[...new Set(its.map(i=>i.category||"").filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-Hant",{numeric:true}));
  if(cat&&!cats.includes(cat)) cat="";
  const left=c=>its.filter(i=>(i.category||"")===c).reduce((t,i)=>t+Number(i.qty||0),0);
  $("#catChips").hidden=$("#catH").hidden=!cats.length;
  $("#catChips").innerHTML=[`<button class="cat" type="button" data-cf="" aria-pressed="${!cat}"><span class="k">全部</span><span class="v num">${fmtN(inStock.reduce((t,i)=>t+Number(i.qty||0),0))}<small>件</small></span></button>`]
    .concat(cats.map(c=>{ const n=left(c); return `<button class="cat${n?"":" zero"}" type="button" data-cf="${esc(c)}" aria-pressed="${cat===c}"><span class="k">${esc(c)}</span><span class="v num">${n?`剩 ${fmtN(n)}`:"沒了"}<small>${n?"件":""}</small></span></button>`; })).join("");
  const q=$("#q").value.trim().toLowerCase();
  const rows=its.filter(i=>Number(i.qty)>0&&(!cat||i.category===cat)&&(!q||[i.name,i.sku,i.category].join(" ").toLowerCase().includes(q)))
    .sort((x,y)=>(Number(y.qty)>0)-(Number(x.qty)>0)||String(x.sku||x.name).localeCompare(String(y.sku||y.name),"zh-Hant",{numeric:true}));
  const vars=i=>(i.variants||[]).length?`<span class="meta">${i.variants.map(x=>`<span class="tag${Number(x.qty)>0?"":" out"}">${esc(x.name)} ×${fmtN(x.qty)}</span>`).join("")}</span>`:"";
  const qty=i=>`<span class="q num">${fmtN(i.qty)}<small>${esc(i.unit||"件")}</small></span>`;
  const big=i=>i.image?`data-big="${esc(i.image)}"`:"";
  const tile=i=>`<div class="tile">${i.image?`<div class="ph"><img src="${esc(i.image)}" alt="${esc(i.name)}" loading="lazy" ${big(i)}></div>`:""}
      <div class="tb"><span class="nm2">${esc(i.sku||i.name)}</span><span class="row"><span>${money(i.price)}</span>${qty(i)}</span>${vars(i)}</div></div>`;
  const line=i=>`<div class="card">${i.image?`<img class="pimg" src="${esc(i.image)}" alt="" loading="lazy" ${big(i)}>`:""}<div class="body"><span class="title">${esc(i.name)}</span><span class="meta">${i.sku?`<span class="tag">#${esc(i.sku)}</span>`:""}<span class="num">${money(i.price)}</span></span>${vars(i)}</div><div class="right"><span class="qty num">${fmtN(i.qty)}<small>${esc(i.unit||"件")}</small></span></div></div>`;
  document.querySelectorAll("[data-vm]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.vm===mode)));
  const groups=[]; rows.forEach(i=>{ const c=i.category||""; let g=groups.find(x=>x.c===c); if(!g) groups.push(g={c,list:[]}); g.list.push(i); });
  groups.sort((a,b)=>a.c.localeCompare(b.c,"zh-Hant",{numeric:true}));
  $("#list").innerHTML=rows.length?groups.map(g=>`<section class="grp">${g.c||groups.length>1?`<h3>${esc(g.c||"其他")}<span>剩 ${fmtN(g.list.reduce((t,i)=>t+Number(i.qty||0),0))} 件</span></h3>`:""}${mode==="list"?`<div class="lst">${g.list.map(line).join("")}</div>`:`<div class="tiles">${g.list.map(tile).join("")}</div>`}</section>`).join("")
    :`<div class="empty"><b>${its.length?"沒有符合的商品":"目前沒有在店的商品"}</b></div>`;
}
document.addEventListener("click",e=>{ const z=e.target.closest(".zoom"); if(z){ z.remove(); return; }
  const im=e.target.closest("[data-big]"); if(im){ const d=document.createElement("div"); d.className="zoom"; d.innerHTML=`<img src="${im.dataset.big}" alt="">`; document.body.appendChild(d); return; }
  const tb=e.target.closest("[data-tab]"); if(tb){ tab=tb.dataset.tab; view&&render(); return; }
  const sm=e.target.closest("[data-sm]"); if(sm){ smonth=sm.dataset.sm; view&&render(); return; }
  const vm=e.target.closest("[data-vm]"); if(vm){ mode=vm.dataset.vm; try{ localStorage.setItem("vendorMode",mode); }catch(e){} view&&render(); return; }
  const b=e.target.closest("[data-cf]"); if(b){ cat=b.dataset.cf; render(); } });
$("#q").oninput=()=>view&&render();
(function(){
  const t=new URLSearchParams(location.search).get("t");
  if(!t||!/^[a-f0-9]{16,64}$/.test(t)) return fail("連結不完整");
  if(!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey)) return fail("頁面還沒設定好");
  firebase.initializeApp(window.FIREBASE_CONFIG);
  firebase.firestore().collection("vendorViews").doc(t).onSnapshot(d=>{
    if(!d.exists) return fail("這個連結已經失效");
    view=d.data(); document.title=`${view.brand} 寄售庫存`; $("#bname").textContent=`${view.brand}`; if(view.logo){ $("#blogo").src=view.logo; $("#blogo").hidden=false; }
    $("#upd").textContent="更新於 "+new Date(view.updatedAt||Date.now()).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
    $("#tabs").hidden=!view.sales; if(!view.sales) tab="stock"; render();
  }, ()=>fail("這個連結已經失效"));
})();
</script>
<script>
document.getElementById("refreshBtn").onclick=async e=>{ const b=e.currentTarget; b.classList.add("spin"); b.disabled=true;
  try{ if(navigator.serviceWorker){ const r=await navigator.serviceWorker.getRegistration(); if(r) await r.update(); } }catch(err){}
  location.reload(); };
</script>
<script>
(function(){ if(!("serviceWorker" in navigator)) return;
  // when a new version is published, pick it up the next time the app comes back to the screen
  const had=!!navigator.serviceWorker.controller; let done=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had&&!done){ done=true; location.reload(); } });
  const check=()=>navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
  setInterval(check, 30*60*1000);
})();
</script>
